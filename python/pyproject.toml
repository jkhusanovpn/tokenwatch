[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenwatch-sdk"
version = "0.1.0"
description = "Zero-dependency LLM cost & quality telemetry for indie AI builders. One-line client wrappers, budget kill-switch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/javoxir/tokenwatch"
